server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

  location = /deckcraft { return 308 /deckcraft/; }
  location = /wordcraft { return 308 /wordcraft/; }
  location = /pdfcraft { return 308 /pdfcraft/; }
  location = /gridcraft { return 308 /gridcraft/; }
  location = /photocraft { return 308 /photocraft/; }
  location = /filmcraft { return 308 /filmcraft/; }
  location = /vectorcraft { return 308 /vectorcraft/; }

  # All upstream web releases use relative asset URLs and support path-prefix deployment.
  # The trailing slash in proxy_pass strips /appname/ before forwarding.
  location = /deckcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /deckcraft/editor { return 308 /deckcraft/editor/; }
  location ^~ /deckcraft/editor/ {
    proxy_pass http://deckcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /deckcraft/ {
    proxy_pass http://deckcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /wordcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /wordcraft/editor { return 308 /wordcraft/editor/; }
  location ^~ /wordcraft/editor/ {
    proxy_pass http://wordcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /wordcraft/ {
    proxy_pass http://wordcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /pdfcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /pdfcraft/editor { return 308 /pdfcraft/editor/; }
  location ^~ /pdfcraft/editor/ {
    proxy_pass http://pdfcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /pdfcraft/ {
    proxy_pass http://pdfcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /gridcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /gridcraft/editor { return 308 /gridcraft/editor/; }
  location ^~ /gridcraft/editor/ {
    proxy_pass http://gridcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /gridcraft/ {
    proxy_pass http://gridcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /photocraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /photocraft/editor { return 308 /photocraft/editor/; }
  location ^~ /photocraft/editor/ {
    proxy_pass http://photocraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /photocraft/ {
    proxy_pass http://photocraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /filmcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /filmcraft/editor { return 308 /filmcraft/editor/; }
  location ^~ /filmcraft/editor/ {
    proxy_pass http://filmcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /filmcraft/ {
    proxy_pass http://filmcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /vectorcraft/ {
    try_files /editor.html =404;
    add_header Cache-Control "no-store" always;
  }
  location = /vectorcraft/editor { return 308 /vectorcraft/editor/; }
  location ^~ /vectorcraft/editor/ {
    proxy_pass http://vectorcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location ^~ /vectorcraft/ {
    proxy_pass http://vectorcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }

  location = /editor.html { return 404; }
  location = /assets/editor.js { add_header Cache-Control "no-cache" always; }
  location = /assets/editor.css { add_header Cache-Control "no-cache" always; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri/ =404; }
  location ~ /\. { return 404; }
}
