server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /deckcraft { return 308 /deckcraft/; }
  location = /wordcraft { return 308 /wordcraft/; }
  location = /pdfcraft { return 308 /pdfcraft/; }

  # Trailing slash on proxy_pass strips the context prefix before reaching each editor.
  # All editors use relative WASM/JS asset URLs, so no HTML rewriting is required.
  location ^~ /deckcraft/ {
    proxy_pass http://deckcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location ^~ /wordcraft/ {
    proxy_pass http://wordcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location ^~ /pdfcraft/ {
    proxy_pass http://pdfcraft-web:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  location ~ /\. { return 404; }
}
