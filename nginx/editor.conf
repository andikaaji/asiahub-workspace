server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/wasm text/javascript application/javascript text/css image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  # PhotoCraft boot loads these unversioned paths; stale cache breaks newer builds.
  location = /app/photocraft-web.js {
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /app/parts.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # PhotoCraft compressed WASM parts are already gzip bytes: do not double encode.
  location ~ \.part-[a-z]+$ {
    default_type application/octet-stream;
    gzip off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.wasm$ {
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.(ttf|otf|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ =404; }
}
